name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run full test suite (unit, contract, story e2e) with coverage
        run: pytest --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Verify E2E marker subset
        run: pytest -m e2e -q --tb=short

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: python scripts/coverage_badge.py --xml coverage.xml --summary .badges/coverage-summary.json

      - name: Commit refreshed coverage badge if changed
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet .badges/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .badges/
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          else
            echo "Coverage badge unchanged; nothing to commit."
          fi
