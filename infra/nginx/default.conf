server {
  listen 80;
  server_name _;

  # Re-resolve upstreams at request time via Docker's embedded DNS (127.0.0.11).
  #
  # With a literal hostname in `proxy_pass` (e.g. `proxy_pass http://api:8000/;`)
  # nginx resolves the container IP ONCE at startup and caches it forever. When
  # any backend is recreated — every `docker compose up --build` / redeploy /
  # restart — Docker assigns it a NEW IP, but nginx keeps proxying to the dead
  # old one and returns 502 on every request until nginx itself is restarted.
  # In production that silently broke the Telegram webhook: customer messages
  # 502'd at nginx, never reached bot_gateway, and the bot "didn't answer".
  #
  # Putting the upstream host in a variable forces nginx to resolve it through
  # the resolver below on each request (honouring the short `valid` TTL), so a
  # backend restart no longer strands routing. `ipv6=off` avoids stalled AAAA
  # lookups against Docker DNS.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /health/live {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /api/ {
    set $upstream_api api;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    set $upstream_web_ui web_ui;
    rewrite ^/admin/(.*)$ /$1 break;
    proxy_pass http://$upstream_web_ui:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /telegram/webhook {
    set $upstream_bot_gateway bot_gateway;
    proxy_pass http://$upstream_bot_gateway:8002/telegram/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
